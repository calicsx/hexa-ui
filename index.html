<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hexa UI</title>
        <link rel="stylesheet" href="/tokens.css" />
        <link rel="stylesheet" href="/demo.css" />
    </head>
    <body class="bg-background text-foreground mx-auto my-12 max-w-lg px-4 font-sans">
        <div class="mb-6 flex gap-3">
            <hx-color-mode-button></hx-color-mode-button>
        </div>

        <section class="mb-8">
            <h2 class="text-muted-foreground mb-3 text-sm font-semibold tracking-wide uppercase">Icon</h2>
            <div class="flex flex-wrap items-center gap-4">
                <hx-icon data-icon="Search"></hx-icon>
                <hx-icon data-icon="Heart" size="20"></hx-icon>
                <hx-icon data-icon="Settings" size="24" stroke-width="1.5"></hx-icon>
                <hx-icon data-icon="CircleAlert" size="24" class="text-destructive"></hx-icon>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-muted-foreground mb-3 text-sm font-semibold tracking-wide uppercase">Button</h2>
            <div class="flex flex-wrap gap-3">
                <hx-button>Primary</hx-button>
                <hx-button variant="secondary">Secondary</hx-button>
                <hx-button variant="outline">Outline</hx-button>
                <hx-button variant="ghost">Ghost</hx-button>
                <hx-button variant="destructive">Delete</hx-button>
            </div>
            <div class="mt-3 flex flex-wrap items-center gap-3">
                <hx-button size="sm">Small</hx-button>
                <hx-button size="md">Medium</hx-button>
                <hx-button size="lg">Large</hx-button>
            </div>
            <div class="mt-3 flex flex-wrap items-center gap-3">
                <hx-button><hx-icon data-icon="Plus"></hx-icon>Add</hx-button>
                <hx-button variant="outline"><hx-icon data-icon="Download"></hx-icon>Download</hx-button>
                <hx-button variant="destructive"><hx-icon data-icon="Trash2"></hx-icon>Delete</hx-button>
            </div>
            <div class="mt-3 flex flex-wrap items-center gap-3">
                <hx-button square><hx-icon data-icon="Plus" size="20"></hx-icon></hx-button>
                <hx-button variant="outline" square><hx-icon data-icon="Download" size="20"></hx-icon></hx-button>
                <hx-button variant="destructive" square><hx-icon data-icon="Trash2" size="20"></hx-icon></hx-button>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-muted-foreground mb-3 text-sm font-semibold tracking-wide uppercase">Input</h2>
            <div class="flex flex-col gap-3">
                <hx-input label="Email" type="email" placeholder="you@example.com"></hx-input>
                <hx-input label="Password" type="password" hint="Should not be disclosed."></hx-input>
                <hx-input label="Login" value="admin" error="This login is already used." required></hx-input>
                <hx-input label="Disabled" disabled></hx-input>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-muted-foreground mb-3 text-sm font-semibold tracking-wide uppercase">Textarea</h2>
            <div class="flex flex-col gap-3">
                <hx-textarea label="Bio" placeholder="Tell us about yourself" hint="Max 500 characters."></hx-textarea>
                <hx-textarea label="Comment" error="This field is required." required></hx-textarea>
                <hx-textarea label="Disabled" disabled></hx-textarea>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-muted-foreground mb-3 text-sm font-semibold tracking-wide uppercase">Checkbox</h2>
            <div class="flex flex-col gap-3">
                <hx-checkbox>Default</hx-checkbox>
                <hx-checkbox checked>Checked</hx-checkbox>
                <hx-checkbox indeterminate>Indeterminate</hx-checkbox>
                <hx-checkbox disabled>Disabled</hx-checkbox>
                <hx-checkbox checked disabled>Checked and disabled</hx-checkbox>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-muted-foreground mb-3 text-sm font-semibold tracking-wide uppercase">Switch</h2>
            <div class="flex flex-col gap-3">
                <hx-switch>Default</hx-switch>
                <hx-switch checked>Checked</hx-switch>
                <hx-switch disabled>Disabled</hx-switch>
            </div>
            <div class="mt-3 flex flex-wrap items-center gap-4">
                <hx-switch size="sm">Small</hx-switch>
                <hx-switch>Medium</hx-switch>
                <hx-switch size="lg">Large</hx-switch>
            </div>
        </section>

        <script type="module" src="/src/index.ts"></script>
        <script type="module">
            // Demo only: in an app, import each icon and bind it with `.icon=${Search}`.
            import { CircleAlert, Download, Heart, Plus, Search, Settings, Trash2 } from "lucide";
            const icons = { CircleAlert, Download, Heart, Plus, Search, Settings, Trash2 };
            for (const el of document.querySelectorAll("hx-icon[data-icon]")) el.icon = icons[el.dataset.icon];
        </script>
    </body>
</html>
